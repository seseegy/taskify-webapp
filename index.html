<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Taskify — tugas, jurnal, keuangan, kalender, dan vault kode."
    />
    <meta name="theme-color" content="#1e1b4b" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Taskify</title>
    <script>
      // Pasang tema sebelum React render → tidak ada kedipan warna saat dibuka
      (function () {
        try {
          var pref = localStorage.getItem('taskify-theme');
          var dark =
            pref === 'dark' ||
            (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Taskify membutuhkan JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
