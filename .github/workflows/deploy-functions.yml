# Deploy Edge Function Supabase tanpa terminal (lihat docs/SETUP.md §16).
# Actions → "Deploy Edge Function" → Run workflow → pilih fungsi.
#
# HANYA men-deploy fungsi. Database (migrasi) TIDAK disentuh: migrasi tetap dijalankan manual
# lewat SQL Editor. Secret fungsi (R2_*, CRON_SECRET, VAPID_*) disimpan di Supabase, bukan di sini.
#
# Secret GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  Supabase → Account → Access Tokens
#   SUPABASE_PROJECT_REF   ID project (bagian URL dashboard: /project/<ref>)
name: Deploy Edge Function

on:
  workflow_dispatch:
    inputs:
      function:
        description: Fungsi yang di-deploy
        type: choice
        required: true
        default: tempfiles
        options:
          - tempfiles
          - files
          - send-reminders
          - semua

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Periksa secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF belum diisi (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      # Versi sama dengan devDependency `supabase` di package.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          FUNCTION: ${{ inputs.function }}
        run: |
          if [ "$FUNCTION" = "semua" ]; then
            names="tempfiles files send-reminders"
          else
            names="$FUNCTION"
          fi
          for name in $names; do
            echo "::group::Deploy $name"
            # Semua fungsi memeriksa login sendiri (JWT aal2 / x-cron-secret / tautan publik)
            supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            echo "::endgroup::"
          done
