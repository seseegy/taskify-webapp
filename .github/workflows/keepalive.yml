# Cegah project Supabase free tier di-pause (dipause setelah ±7 hari tanpa aktivitas).
# Menjalankan query ringan langsung ke Postgres setiap 2 hari. Lihat docs/SETUP.md §9.
name: Keep-alive Supabase

on:
  schedule:
    - cron: '17 1 */2 * *' # 01:17 UTC tiap 2 hari
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query ringan ke database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL belum diisi"
            exit 1
          fi
          docker run --rm -e SUPABASE_DB_URL postgres:17-alpine \
            sh -c 'psql "$SUPABASE_DB_URL" -tAc "select now(), count(*) from public.user_settings"'
